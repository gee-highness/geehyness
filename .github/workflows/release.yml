name: Release
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (e.g. v0.1.0)'
        required: true
permissions:
  contents: write
env:
  TAG: ${{ github.event.inputs.tag || github.ref_name }}
jobs:
  create:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - env: { GH_TOKEN: '${{ github.token }}' }
        run: gh release view "$TAG" >/dev/null 2>&1 || gh release create "$TAG" --title "Shesha $TAG" --generate-notes --target "$GITHUB_SHA"
  linux:
    needs: create
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci --legacy-peer-deps
      - run: npm run build
      - run: sudo apt-get update && sudo apt-get install -y libarchive-tools
      - run: npx electron-builder --linux --publish never
      - env: { GH_TOKEN: '${{ github.token }}' }
        run: gh release upload "$TAG" release/*.AppImage release/*.pacman release/*.tar.gz --clobber
  android:
    needs: create
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21 }
      - run: npm ci --legacy-peer-deps
      - run: npm run build
      - run: npx cap sync android
      - run: cd android && chmod +x gradlew && ./gradlew assembleDebug --no-daemon
      - env: { GH_TOKEN: '${{ github.token }}' }
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk shesha-android.apk
          gh release upload "$TAG" shesha-android.apk --clobber
  windows:
    needs: create
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci --legacy-peer-deps
      - run: npm run build
      - run: npx electron-builder --win --publish never
      - env: { GH_TOKEN: '${{ github.token }}' }
        shell: bash
        run: gh release upload "$TAG" release/*.exe --clobber
